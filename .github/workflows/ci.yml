name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (unit + integration tests on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts PostgreSQL with the runner's Docker.
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: api/target/site/jacoco

  web:
    name: Web (tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack (images build, API healthy, login works)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Log in through nginx with a demo account
        # The Origin header is what a browser sends: nginx must forward the host
        # with its port, or the API rejects the call as cross-origin (403).
        run: |
          curl -sf -X POST localhost:8081/api/auth/login \
            -H 'Origin: http://localhost:8081' \
            -H 'Content-Type: application/json' \
            -d '{"email":"amina.employee@example.com","password":"password"}' | tee login.json
          test "$(jq -r .user.role login.json)" = EMPLOYEE
      - if: failure()
        run: docker compose logs api
